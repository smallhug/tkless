name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --locked

      - name: Check without default features
        run: cargo check -p tkless-core --no-default-features --all-targets --locked

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check documentation and executable contracts
        run: |
          cargo build -p tkless-cli --locked
          node scripts/check-docs.cjs

      - name: Check DSH bundle
        run: node scripts/check-dsh-bundle.cjs

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - run: cargo check --workspace --all-targets --locked

  browser:
    name: Local Chrome workflow
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise disposable browser against local fixtures
        run: cargo test -p tkless-core --test bing_cdp_test --locked -- --ignored
