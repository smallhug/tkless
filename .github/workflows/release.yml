name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: tkless-windows-amd64.exe
            binary_name: tkless.exe
            pkg_type: exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tkless-linux-amd64
            binary_name: tkless
            pkg_type: binary
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: tkless-linux-arm64
            binary_name: tkless
            pkg_type: binary
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: tkless-macos-amd64.dmg
            binary_name: tkless
            pkg_type: dmg
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: tkless-macos-arm64.dmg
            binary_name: tkless
            pkg_type: dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux ARM64 cross compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        env:
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p tkless-cli
          else
            cargo build --release --target ${{ matrix.target }} -p tkless-cli
          fi
        shell: bash

      - name: Package Release Artifact
        run: |
          binary="./target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          test -s "$binary" || { echo "Release binary is empty or missing" >&2; exit 1; }
          if [ "${{ matrix.use_cross }}" != "true" ]; then
            actual_version="$("$binary" --version)"
            case "$actual_version" in
              "tkless ${GITHUB_REF_NAME#v} "*|"tkless ${GITHUB_REF_NAME#v}") ;;
              *) echo "Unexpected binary version: $actual_version" >&2; exit 1 ;;
            esac
          fi
          if [ "${{ matrix.pkg_type }}" = "exe" ]; then
            cp ./target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.artifact_name }}
          elif [ "${{ matrix.pkg_type }}" = "dmg" ]; then
            mkdir -p dmg_root
            cp ./target/${{ matrix.target }}/release/${{ matrix.binary_name }} dmg_root/
            cp README.md dmg_root/
            hdiutil create -volname "TkLess" -srcfolder dmg_root -ov -format UDZO ./${{ matrix.artifact_name }}
          else
            cp ./target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.artifact_name }}
            chmod +x ./${{ matrix.artifact_name }}
          fi
        shell: bash

      - name: Generate SHA-256 Checksum
        run: |
          test -s "${{ matrix.artifact_name }}" || { echo "Release artifact is empty or missing" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi
        shell: bash

      - name: Publish GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
