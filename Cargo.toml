[workspace]
resolver = "2"
members = [
    "crates/tkless-core",
    "crates/tkless-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["TkLess Contributors"]
license = "MIT OR Apache-2.0"
description = "TkLess: Spend less tokens, perceive more web."

[workspace.dependencies]
# Internal workspace crates
tkless-core = { path = "crates/tkless-core" }

# Async runtime & networking
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
    "stream",
] }
url = "2.5"

# HTML parsing & DOM processing
scraper = "0.22"
ego-tree = "0.10"
readability = "0.3"
htmd = "0.4"
encoding_rs = "0.8"
flate2 = "1.0"

# Token estimation & counting
tiktoken-rs = "0.12"
regex = "1.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# CLI & Diagnostics
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"
winres = "0.1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
